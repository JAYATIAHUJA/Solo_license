<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="Benchmark: trusting the tool versus Solo License" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
