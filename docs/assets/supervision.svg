<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Supervision cost by autonomy level" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="760" height="330" rx="12" fill="#ffffff" stroke="#e6e3dc"/>
<text x="32" y="44" font-size="20" fill="#0e0e0d" font-weight="600" text-anchor="start">Human review cost per month, by autonomy level</text>
<text x="32" y="68" font-size="13" fill="#76746e" font-weight="400" text-anchor="start">10,000 actions/month · $45/h loaded cost · stated assumptions (cfo/model.py)</text>
<text x="32" y="115" font-size="14" fill="#0e0e0d" font-weight="400" text-anchor="start">L0 · Suggests only</text>
<rect x="260" y="100" width="290.0" height="22" fill="#0e0e0d"/>
<text x="560.0" y="116" font-size="13" fill="#76746e" font-weight="400" text-anchor="start">$45,000  (6 min each)</text>
<text x="32" y="159" font-size="14" fill="#0e0e0d" font-weight="400" text-anchor="start">L1 · Needs your OK</text>
<rect x="260" y="144" width="145.0" height="22" fill="#0e0e0d"/>
<text x="415.0" y="160" font-size="13" fill="#76746e" font-weight="400" text-anchor="start">$22,500  (3 min each)</text>
<text x="32" y="203" font-size="14" fill="#0e0e0d" font-weight="400" text-anchor="start">L2 · Works alone up to a limit</text>
<rect x="260" y="188" width="24.2" height="22" fill="#1f7a4d"/>
<text x="294.1666666666667" y="204" font-size="13" fill="#76746e" font-weight="400" text-anchor="start">$3,750  (0.5 min each)</text>
<text x="32" y="247" font-size="14" fill="#0e0e0d" font-weight="400" text-anchor="start">L3 · Works alone</text>
<rect x="260" y="232" width="4.8" height="22" fill="#1f7a4d"/>
<text x="274.8333333333333" y="248" font-size="13" fill="#76746e" font-weight="400" text-anchor="start">$750  (0.1 min each)</text>
<text x="32" y="280" font-size="14" fill="#1f7a4d" font-weight="600" text-anchor="start">Earning L2 saves $41,250/month in review time.</text>
<text x="32" y="304" font-size="14" fill="#d8341f" font-weight="600" text-anchor="start">Running a level it has not earned adds ~$18,000/month in incidents.</text>
</svg>